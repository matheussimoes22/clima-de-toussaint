<!doctype html>
<html lang="pt-br" id="html-root" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <style>
      html,
      body {
        background: #0f172a;
      }
      html.booting #app,
      html.booting #weather-bg {
        visibility: hidden;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(ellipse at center, #243044, #0f172a 65%);
        color: #e6c879;
        font-family: Georgia, serif;
        text-align: center;
        transition: opacity 0.22s ease;
      }
      #app-splash img {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 0 18px #e6c83935);
        animation: splash-breathe 1.8s ease-in-out infinite;
      }
      #app-splash strong {
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 400;
        letter-spacing: 0.08em;
      }
      #app-splash small {
        color: #b9c5d5;
        font: 14px system-ui;
      }
      #app-splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-breathe {
        50% {
          transform: scale(1.045);
          filter: drop-shadow(0 0 26px #e6c83965);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img {
          animation: none;
        }
        #app-splash {
          transition: none;
        }
      }
    </style>
    <title>Clima de Toussaint</title>
    <link rel="icon" href="favicon.ico" sizes="48x48" type="image/x-icon" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0F172A" />
    <meta
      name="description"
      content="Previsão climática realista do ducado de Toussaint, com ciclos lunares e calendário élfico."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clima de Toussaint" />
    <meta
      property="og:description"
      content="Meteorologia fictícia e coerente do ducado de Toussaint."
    />
    <meta property="og:url" content="https://weathertoussaint.netlify.app/" />
    <link rel="canonical" href="https://weathertoussaint.netlify.app/" />
    <link rel="apple-touch-icon" href="favicon.ico" />

    <!-- Google Fonts (Cinzel for headings, Inter for body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      data-app-style
      onerror="this.dataset.failed='true'"
      rel="stylesheet"
      href="assets/css/tailwind.css"
      media="print"
      onload="this.media='all'"
    />
    <link
      data-app-style
      onerror="this.dataset.failed='true'"
      rel="stylesheet"
      href="assets/css/styles.css"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body class="bg-slate-900 text-gray-200">
    <div id="app-splash" role="status" aria-live="polite">
      <img src="assets/icons/app-icon.svg" alt="" /><strong
        >Clima de Toussaint</strong
      ><small id="splash-message">Preparando o observatório ducal…</small
      ><a id="splash-retry" href="" hidden>Recarregar</a>
    </div>
    <noscript
      ><style>
        #app-splash small {
          display: none;
        }
      </style>
      <p style="position: fixed; bottom: 20px; z-index: 10000; color: white">
        Ative o JavaScript para abrir o observatório.
      </p></noscript
    >
    <script>
      window.addEventListener(
        "error",
        function (e) {
          if (
            document.documentElement.classList.contains("booting") &&
            (e.target.tagName === "SCRIPT" || e.message)
          ) {
            document.getElementById("splash-message").textContent =
              "Não foi possível iniciar o observatório.";
            document.getElementById("splash-retry").hidden = false;
          }
        },
        true,
      );
    </script>
    <a href="#main-content" class="skip-link" data-key="Ir para conteúdo"
      >Ir para conteúdo</a
    >
    <!-- Fundo climático dinâmico -->
    <div id="weather-bg" aria-hidden="true"></div>

    <!-- Recipiente principal do aplicativo -->
    <div
      id="app"
      class="flex flex-col md:flex-row h-screen w-full overflow-hidden"
    >
      <!-- Barra Lateral -->
      <nav
        aria-label="Navegação principal"
        data-aria-key="Navegação principal"
        class="app-nav bg-slate-950 border-t border-slate-700 md:border-t-0 md:border-r md:w-64 md:h-full p-2 md:p-6 md:flex md:flex-col md:justify-between shadow-lg z-30 order-last md:order-first"
      >
        <!-- Navegação -->
        <ul class="flex justify-around md:flex-col md:space-y-4">
          <li>
            <button
              data-view="today"
              class="nav-button flex flex-col items-center md:flex-row md:w-full md:space-x-3 p-2 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-amber-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9"
                />
              </svg>
              <span class="text-xs md:text-base nav-label" data-key="Hoje"
                >Hoje</span
              >
            </button>
          </li>
          <li>
            <button
              data-view="calendar"
              class="nav-button flex flex-col items-center md:flex-row md:w-full md:space-x-3 p-2 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-amber-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                />
              </svg>
              <span class="text-xs md:text-base nav-label" data-key="Calendário"
                >Calendário</span
              >
            </button>
          </li>
          <li>
            <button
              data-view="monthly"
              class="nav-button flex flex-col items-center md:flex-row md:w-full md:space-x-3 p-2 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-amber-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"
                />
              </svg>
              <span class="text-xs md:text-base nav-label" data-key="Previsão"
                >Previsão</span
              >
            </button>
          </li>
          <li>
            <button
              data-view="moon"
              class="nav-button flex flex-col items-center md:flex-row md:w-full md:space-x-3 p-2 rounded-lg text-gray-400 hover:bg-slate-800 hover:text-amber-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                />
              </svg>
              <span class="text-xs md:text-base nav-label" data-key="Lua"
                >Lua</span
              >
            </button>
          </li>
        </ul>

        <!-- Language selector -->
        <div
          class="hidden md:block mt-auto md:mb-3 border-t border-slate-800 pt-4 px-1"
        >
          <div class="flex items-center justify-between">
            <span
              id="lang-label"
              class="text-xs font-cinzel text-gray-400 uppercase tracking-wider"
              data-key="Idioma"
              >Idioma</span
            >
            <div
              class="inline-flex bg-slate-800 rounded overflow-hidden border border-slate-700"
            >
              <button
                type="button"
                data-lang="pt"
                class="lang-btn px-2 py-1 text-xs font-semibold transition-colors"
                title="Português"
              >
                PT
              </button>
              <button
                type="button"
                data-lang="en"
                class="lang-btn px-2 py-1 text-xs font-semibold transition-colors"
                title="English"
              >
                EN
              </button>
            </div>
          </div>
        </div>

        <!-- Toggle Calendário Élfico -->
        <div
          class="hidden md:block md:mb-6 border-t border-slate-800 pt-4 px-1"
        >
          <div class="flex items-center justify-between">
            <span
              id="elf-label"
              class="text-xs font-cinzel text-gray-400 uppercase tracking-wider"
              data-key="Calendário Élfico"
              >Calendário Élfico</span
            >
            <div
              class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in"
            >
              <input
                type="checkbox"
                name="toggle"
                id="elf-toggle"
                class="elf-toggle-input toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer top-0 left-0"
              />
              <label
                for="elf-toggle"
                class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-700 cursor-pointer"
              ></label>
            </div>
          </div>
          <p id="elf-status" class="text-[10px] text-gray-500 mt-1 text-right">
            Desligado
          </p>
        </div>

        <!-- Alerta (Desktop) -->
        <div
          id="desktop-alert-container"
          role="status"
          aria-live="polite"
          class="hidden md:block mt-2 space-y-2"
        ></div>
      </nav>

      <!-- Conteúdo Principal -->
      <main
        id="main-content"
        tabindex="-1"
        class="flex-1 overflow-y-auto p-4 md:p-8"
      >
        <!-- O conteúdo da view será injetado aqui -->
      </main>
    </div>

    <!-- Ajustes mobile (idioma + calendário élfico) -->
    <div id="mobile-controls" class="md:hidden fixed top-3 right-3 z-40">
      <button
        type="button"
        id="mobile-settings-btn"
        aria-label="Ajustes"
        data-aria-key="Ajustes"
        aria-controls="mobile-settings-panel"
        aria-expanded="false"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
      </button>
      <div id="mobile-settings-panel" aria-hidden="true" inert>
        <div class="flex items-center justify-between gap-3">
          <span
            class="text-[11px] font-cinzel text-gray-300 uppercase tracking-wider"
            data-key="Idioma"
            >Idioma</span
          >
          <div
            class="inline-flex bg-slate-800 rounded overflow-hidden border border-slate-700"
          >
            <button
              type="button"
              data-lang="pt"
              class="lang-btn px-2 py-1 text-xs font-semibold transition-colors"
              title="Português"
            >
              PT
            </button>
            <button
              type="button"
              data-lang="en"
              class="lang-btn px-2 py-1 text-xs font-semibold transition-colors"
              title="English"
            >
              EN
            </button>
          </div>
        </div>
        <div
          class="flex items-center justify-between gap-3 border-t border-slate-800 pt-3"
        >
          <span
            class="text-[11px] font-cinzel text-gray-300 uppercase tracking-wider"
            data-key="Calendário Élfico"
            >Calendário Élfico</span
          >
          <span class="relative inline-block w-9 shrink-0 align-middle">
            <input
              type="checkbox"
              id="elf-toggle-mobile"
              class="elf-toggle-input toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-2 appearance-none cursor-pointer top-0 left-0"
            />
            <label
              for="elf-toggle-mobile"
              class="toggle-label block overflow-hidden h-4 rounded-full bg-gray-700 cursor-pointer"
            ></label>
          </span>
        </div>
      </div>
    </div>

    <!-- Modais -->
    <div
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      aria-hidden="true"
      inert
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-75 opacity-0 pointer-events-none"
    >
      <div
        id="modal-content"
        class="bg-slate-800 w-full max-w-lg md:max-w-2xl rounded-lg shadow-2xl max-h-[90vh] overflow-y-auto border border-amber-400"
      >
        <div
          class="flex justify-between items-center p-4 border-b border-slate-700"
        >
          <h3
            id="modal-title"
            class="font-cinzel text-xl text-amber-400"
            data-key="Detalhes"
          >
            Detalhes
          </h3>
          <button
            id="modal-close"
            type="button"
            aria-label="Fechar"
            data-aria-key="Fechar"
            class="text-gray-400 hover:text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div id="modal-body" class="p-4 md:p-6"></div>
      </div>
    </div>

    <!-- Alerta Mobile -->
    <div
      id="mobile-alert-container"
      role="status"
      aria-live="polite"
      class="md:hidden fixed top-14 left-3 right-3 z-30 flex flex-col space-y-2"
    ></div>
    <!-- A ordem é intencional: traduções → dados → motor → interface. -->
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
